openapi: 3.0.3
info:
  title: AidRun MVP v0.3 API
  version: 0.3.0
  description: |
    助盲跑 / AidRun Swift iOS + Spring Boot MVP REST API contract.
    This contract is frozen for the 3-day demo MVP and intentionally excludes
    WebSocket, real SMS, real identity verification, real admin backend,
    real-time tracks, in-app chat, AI assistant, route navigation, payment,
    inventory, Android, and instant-call dispatch.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot backend
  - url: http://192.168.0.100:8080
    description: LAN demo backend example
tags:
  - name: Auth
  - name: Users
  - name: Profiles
  - name: Volunteer
  - name: Orders
security:
  - bearerAuth: []
paths:
  /api/auth/phone-login:
    post:
      tags: [Auth]
      summary: 手机号登录 / 自动注册
      description: Demo 阶段验证码固定为 123456，首次登录自动创建账号；首次角色选择前 activeRole 可为空。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidVerificationCode'

  /api/users/me:
    get:
      tags: [Users]
      summary: 获取当前用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/active-role:
    patch:
      tags: [Users]
      summary: 切换 activeRole
      description: 共用同一个 JWT；存在 accepted / arrived / in_progress / emergency 订单时禁止切换。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchRoleRequest'
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '409':
          $ref: '#/components/responses/ActiveOrderRoleSwitchBlocked'

  /api/profiles/blind-runner:
    put:
      tags: [Profiles]
      summary: 盲人资料创建/更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlindRunnerProfileUpsertRequest'
      responses:
        '200':
          description: 已保存盲人资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindRunnerProfileDto'

  /api/profiles/volunteer:
    put:
      tags: [Profiles]
      summary: 志愿者资料创建/更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerProfileUpsertRequest'
      responses:
        '200':
          description: 已保存志愿者资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerProfileDto'

  /api/volunteer/mock-verification/approve:
    post:
      tags: [Volunteer]
      summary: Mock 认证通过
      description: MVP 不做真实实名认证；调用后 verificationStatus 和 adminReviewStatus 均设为 approved。
      responses:
        '200':
          description: Mock 认证通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerProfileDto'

  /api/volunteer/availability:
    patch:
      tags: [Volunteer]
      summary: 可服务开关
      description: 关闭后仍可查看订单，但不能接新单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '200':
          description: 已更新可服务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerProfileDto'

  /api/orders:
    post:
      tags: [Orders]
      summary: 创建预约订单
      description: 预约时间必须至少为当前时间 30 分钟后；必须有盲人资料和定位信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '400':
          description: 创建订单失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                appointmentTooSoon:
                  value:
                    code: APPOINTMENT_TOO_SOON
                    message: 预约时间至少需要在 30 分钟后
                locationRequired:
                  value:
                    code: LOCATION_PERMISSION_REQUIRED
                    message: 创建预约需要开启定位权限
                profileIncomplete:
                  value:
                    code: PROFILE_INCOMPLETE
                    message: 请先完善盲人资料和紧急联系人

  /api/orders/my:
    get:
      tags: [Orders]
      summary: 获取我的订单
      description: 用于盲人端订单状态轮询和双方查看历史；MVP 不分页。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunOrderStatus'
      responses:
        '200':
          description: 我的订单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunOrderDto'

  /api/orders/available:
    get:
      tags: [Orders]
      summary: 获取可接订单
      description: 返回 matching 订单；MVP 后端不做距离排序，iOS 根据当前位置排序。
      parameters:
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: 可接订单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableOrderDto'
        '400':
          $ref: '#/components/responses/LocationPermissionRequired'

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: 获取订单详情
      description: 盲人端在 matching / accepted / arrived / in_progress 页面每 5 秒轮询该接口。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '404':
          $ref: '#/components/responses/OrderNotFound'

  /api/orders/{orderId}/accept:
    post:
      tags: [Orders]
      summary: 志愿者接单
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 接单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '400':
          description: 志愿者不可接单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unavailable:
                  value:
                    code: VOLUNTEER_NOT_AVAILABLE
                    message: 请先开启可服务状态
                notApproved:
                  value:
                    code: VOLUNTEER_NOT_APPROVED
                    message: 请先完成志愿者认证
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/OrderAlreadyAccepted'

  /api/orders/{orderId}/arrive:
    post:
      tags: [Orders]
      summary: 志愿者到达
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 状态进入 arrived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/orders/{orderId}/confirm-start:
    post:
      tags: [Orders]
      summary: 盲人确认开始
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 状态进入 in_progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/orders/{orderId}/complete:
    post:
      tags: [Orders]
      summary: 志愿者结束服务
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOrderRequest'
      responses:
        '200':
          description: 状态进入 completed，并给志愿者加 100 积分
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: 取消订单
      description: 仅 matching / accepted / arrived 可普通取消；用户手动取消必须记录取消方和手动取消原因，系统超时取消使用 no_volunteer_available。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: 状态进入 cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/orders/{orderId}/emergency:
    post:
      tags: [Orders]
      summary: 触发求助
      description: accepted / arrived / in_progress 可进入 emergency；MVP 不恢复原状态。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyRequest'
      responses:
        '200':
          description: 状态进入 emergency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOrderDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/orders/{orderId}/rating:
    post:
      tags: [Orders]
      summary: 提交评分
      description: 盲人可在 completed 后评分；MVP UI 不强制提交。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: 评分已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingDto'
        '409':
          $ref: '#/components/responses/InvalidOrderStatus'

  /api/volunteer/service-records:
    get:
      tags: [Volunteer]
      summary: 获取服务记录
      responses:
        '200':
          description: 服务记录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRecordDto'

  /api/volunteer/points:
    get:
      tags: [Volunteer]
      summary: 获取积分
      responses:
        '200':
          description: 积分余额和流水
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerPointsResponse'

  /api/volunteer/points/shop-items:
    get:
      tags: [Volunteer]
      summary: 获取积分商城占位商品
      description: MVP 只展示概念商品，不做兑换、库存或支付。
      responses:
        '200':
          description: 占位商品
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopItemDto'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: 未登录或 token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: 请先登录
    InvalidVerificationCode:
      description: 验证码错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_VERIFICATION_CODE
            message: 验证码错误
    ProfileIncomplete:
      description: 资料不完整
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PROFILE_INCOMPLETE
            message: 请先完善资料
    LocationPermissionRequired:
      description: 需要定位权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: LOCATION_PERMISSION_REQUIRED
            message: 请先开启定位权限
    OrderNotFound:
      description: 订单不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ORDER_NOT_FOUND
            message: 订单不存在
    OrderAlreadyAccepted:
      description: 订单已被其他志愿者接单
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ORDER_ALREADY_ACCEPTED
            message: 订单已被其他志愿者接单
    InvalidOrderStatus:
      description: 订单状态不允许当前操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_ORDER_STATUS
            message: 当前订单状态不允许该操作
    ActiveOrderRoleSwitchBlocked:
      description: 存在活跃订单，禁止切换角色
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ACTIVE_ORDER_ROLE_SWITCH_BLOCKED
            message: 当前存在进行中的订单，暂时不能切换身份

  schemas:
    ErrorCode:
      type: string
      enum:
        - INVALID_VERIFICATION_CODE
        - PROFILE_INCOMPLETE
        - LOCATION_PERMISSION_REQUIRED
        - ORDER_NOT_FOUND
        - ORDER_ALREADY_ACCEPTED
        - INVALID_ORDER_STATUS
        - ACTIVE_ORDER_ROLE_SWITCH_BLOCKED
        - VOLUNTEER_NOT_AVAILABLE
        - VOLUNTEER_NOT_APPROVED
        - APPOINTMENT_TOO_SOON
        - VALIDATION_FAILED
        - UNAUTHORIZED

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string

    UserRole:
      type: string
      enum: [blind_runner, volunteer]

    VerificationStatus:
      type: string
      enum: [not_submitted, pending, approved, rejected]

    AdminReviewStatus:
      type: string
      enum: [not_submitted, pending, approved, rejected]

    RunOrderStatus:
      type: string
      enum: [matching, accepted, arrived, in_progress, completed, cancelled, emergency]

    CancellationActor:
      type: string
      enum: [blind_runner, volunteer]

    ManualCancellationReason:
      type: string
      enum:
        - time_conflict
        - wrong_location
        - temporary_issue
        - cannot_contact
        - other

    CancellationReason:
      type: string
      enum:
        - time_conflict
        - wrong_location
        - temporary_issue
        - cannot_contact
        - other
        - no_volunteer_available

    LocationSource:
      type: string
      enum: [device_location, manual, demo_default]

    PhoneLoginRequest:
      type: object
      required: [phoneNumber, verificationCode]
      properties:
        phoneNumber:
          type: string
          example: '13800000001'
        verificationCode:
          type: string
          example: '123456'

    AuthResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      required: [id, phoneNumber, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        activeRole:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserMeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        blindRunnerProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BlindRunnerProfileDto'
        volunteerProfile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/VolunteerProfileDto'

    SwitchRoleRequest:
      type: object
      required: [activeRole]
      properties:
        activeRole:
          $ref: '#/components/schemas/UserRole'

    EmergencyContactDto:
      type: object
      required: [name, phoneNumber]
      properties:
        name:
          type: string
        phoneNumber:
          type: string

    BlindRunnerProfileUpsertRequest:
      type: object
      required: [nickname, emergencyContact]
      properties:
        nickname:
          type: string
        runningExperience:
          type: string
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContactDto'

    BlindRunnerProfileDto:
      type: object
      required: [id, userId, nickname, emergencyContact, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        runningExperience:
          type: string
          nullable: true
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContactDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VolunteerProfileUpsertRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string

    VolunteerProfileDto:
      type: object
      required:
        - id
        - userId
        - nickname
        - phoneNumber
        - verificationStatus
        - adminReviewStatus
        - isAvailable
        - pointsBalance
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        phoneNumber:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        adminReviewStatus:
          $ref: '#/components/schemas/AdminReviewStatus'
        isAvailable:
          type: boolean
        pointsBalance:
          type: integer
          example: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AvailabilityRequest:
      type: object
      required: [isAvailable]
      properties:
        isAvailable:
          type: boolean

    LocationPoint:
      type: object
      required: [latitude, longitude, source]
      properties:
        latitude:
          type: number
          format: double
          example: 31.2304
        longitude:
          type: number
          format: double
          example: 121.4737
        addressText:
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/LocationSource'

    CreateOrderRequest:
      type: object
      required: [startLocation, appointmentTime]
      properties:
        startLocation:
          $ref: '#/components/schemas/LocationPoint'
        destinationText:
          type: string
        appointmentTime:
          type: string
          format: date-time
        estimatedDurationMinutes:
          type: integer
        estimatedDistanceKm:
          type: number
          format: double
        pacePreference:
          type: string
        preferSameGender:
          type: boolean
        remark:
          type: string

    RunOrderDto:
      type: object
      required:
        - id
        - blindRunnerUserId
        - blindRunnerNickname
        - status
        - startLocation
        - appointmentTime
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        blindRunnerUserId:
          type: string
          format: uuid
        blindRunnerNickname:
          type: string
        blindRunnerPhone:
          type: string
          nullable: true
          description: 志愿者接单后才返回完整电话
        volunteerUserId:
          type: string
          format: uuid
          nullable: true
        volunteerNickname:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/RunOrderStatus'
        startLocation:
          $ref: '#/components/schemas/LocationPoint'
        destinationText:
          type: string
          nullable: true
        appointmentTime:
          type: string
          format: date-time
        estimatedDurationMinutes:
          type: integer
          nullable: true
        estimatedDistanceKm:
          type: number
          format: double
          nullable: true
        pacePreference:
          type: string
          nullable: true
        preferSameGender:
          type: boolean
          nullable: true
        remark:
          type: string
          nullable: true
        cancellation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CancellationDto'
        emergencyEvent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmergencyEventDto'
        serviceSummary:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ServiceSummaryDto'
        rating:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RatingDto'
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        emergencyAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    AvailableOrderDto:
      allOf:
        - $ref: '#/components/schemas/RunOrderDto'
        - type: object
          properties:
            blindRunnerPhone:
              type: string
              nullable: true
              description: 接单前必须为空

    CompleteOrderRequest:
      type: object
      properties:
        summaryText:
          type: string

    CancelOrderRequest:
      type: object
      required: [cancelledBy, cancelledReason]
      properties:
        cancelledBy:
          $ref: '#/components/schemas/CancellationActor'
        cancelledReason:
          $ref: '#/components/schemas/ManualCancellationReason'
        otherReasonText:
          type: string

    CancellationDto:
      type: object
      required: [id, orderId, cancelledBy, cancelledReason, createdAt]
      properties:
        id:
          type: string
          format: uuid
