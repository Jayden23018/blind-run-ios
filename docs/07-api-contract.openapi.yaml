      "post": {
        "tags": [
          "volunteer-registration-controller"
        ],
        "summary": "查询动作活体认证结果（Step 3）",
        "description": "提交 certifyId 查询阿里云实人认证结果；PENDING 时前端继续轮询。结果首次变为 APPROVED 时，外部后端必须原子设置 registrationStep = STEP_4_COMPLETED 和 canAcceptOrders = true，新注册不得进入 STEP_4_TRAINING。",
