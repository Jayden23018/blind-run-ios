    "/api/volunteer/registration/step3/face-verify/init": {
      "post": {
        "tags": [
          "volunteer-registration-controller"
        ],
        "summary": "发起动作活体认证（Step 3）",
        "description": "提交阿里云实人认证 SDK 采集的 metaInfo。后端从 JWT 获取用户并使用 Step1 已通过的身份数据、ID_PRO、IDENTITY_CARD、MULTI_ACTION、唯一 OuterOrderNo 和配置的 SceneId 创建全新且不可复用的 App SDK 尝试；返回 certifyId 后，iOS 使用 AliyunFaceAuthFacade 原生 SDK 按页面提示完成动作。",
        "operationId": "initFaceVerify",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
