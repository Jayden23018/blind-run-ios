  "components": {
    "schemas": {
      "VolunteerAvailableTimeSlot": {
        "type": "object",
        "properties": {
          "dayOfWeek": {
            "type": "string",
            "minLength": 1,
            "pattern": "MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY"
          },
          "startTime": {
            "type": "string",
            "example": "14:30:00"
          },
          "endTime": {
            "type": "string",
            "example": "14:30:00"
          }
        },
        "required": [
          "endTime",
          "startTime"
        ]
      },
      "VolunteerProfileUpdateRequest": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 50,
            "minLength": 2
          },
          "availableTimeSlots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VolunteerAvailableTimeSlot"
            }
          },
          "acceptsGuideDog": {
            "type": "boolean"
          },
          "paceRange": {
            "type": "string",
            "enum": [
              "WALK_RUN",
              "EASY",
              "MODERATE",
              "FAST",
              "NO_PREFERENCE"
            ]
          },
          "wantsDispatch": {
            "type": "boolean"
          }
        }
      },
      "DispatchStatusRequest": {
        "type": "object",
        "properties": {
          "wantsDispatch": {
            "type": "boolean"
          }
        },
        "required": [
          "wantsDispatch"
        ]
      },
      "VolunteerDispatchSummaryEnvelope": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          },
          "code": {
            "type": "integer",
            "format": "int32"
          },
          "message": {
            "type": "string"
          },
          "data": {
            "$ref": "#/components/schemas/VolunteerDispatchSummaryResponse"
          }
        }
      },
      "VolunteerDispatchSummaryResponse": {
        "type": "object",
        "required": [
          "canDispatch"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "canDispatch": {
                  "const": false
                }
              },
              "required": [
                "canDispatch"
              ]
            },
            "then": {
              "properties": {
                "notAvailableReasons": {
                  "minItems": 1
                }
              },
              "required": [
                "notAvailableReasons"
              ]
            }
          }
        ],
        "properties": {
          "canDispatch": {
            "type": "boolean",
            "description": "后端权威派单资格；客户端不得自行改写为 true。"
          },
          "notAvailableReasons": {
            "type": "array",
            "description": "不可派单原因；canDispatch = false 时至少返回一项。",
            "items": {
              "type": "string",
              "enum": [
                "DISPATCH_DISABLED",
                "REGISTRATION_INCOMPLETE",
                "OFFLINE",
                "OUTSIDE_SERVICE_TIME",
                "NO_LOCATION",
                "ACTIVE_ORDER",
                "NOT_APPROVED"
              ]
            }
          },
          "wantsDispatch": {
            "type": "boolean"
          },
          "isOnline": {
            "type": "boolean"
          },
          "lastLat": {
            "type": "number",
            "format": "double"
          },
          "lastLng": {
            "type": "number",
            "format": "double"
          },
          "lastLocationAt": {
            "type": "string",
            "format": "date-time"
          },
          "coverageRadiusKm": {
            "type": "number",
            "format": "double",
            "description": "当前派单覆盖半径；工作台摘要不得以缺失字段代替尚未计算或不可派单原因。"
          },
          "isWithinServiceTime": {
            "type": "boolean"
          },
          "availableTimeSlots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VolunteerAvailableTimeSlot"
            }
          },
          "avgRating": {
            "type": "number",
            "format": "double"
          },
          "totalRatings": {
            "type": "integer",
            "format": "int32"
          },
          "totalDispatched": {
            "type": "integer",
            "format": "int32"
          },
          "totalAccepted": {
            "type": "integer",
            "format": "int32",
            "description": "接受系统派单次数，不等同于完成次数"
          },
          "totalDeclined": {
            "type": "integer",
            "format": "int32"
          },
          "totalTimeout": {
            "type": "integer",
            "format": "int32"
          },
          "totalCompleted": {
            "type": "integer",
            "format": "int32",
            "description": "完成服务次数；积分系统未接入前 iOS 可用 totalCompleted * 100 显示临时积分"
          },
          "totalCancelled": {
            "type": "integer",
            "format": "int32"
          },
          "acceptanceRate": {
            "type": "number",
            "format": "double"
          },
          "pointsBalance": {
            "type": "integer",
            "format": "int32",
            "description": "真实积分余额；积分系统未接入时可为空，由 iOS 临时计算"
          },
          "activeOrders": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VolunteerDispatchSummaryActiveOrder"
            }
          },
          "recentOrders": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VolunteerDispatchSummaryRecentOrder"
            }
          }
        }
      },
      "VolunteerDispatchSummaryActiveOrder": {
        "type": "object",
