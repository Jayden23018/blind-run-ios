  "components": {
    "schemas": {
      "VolunteerAvailableTimeSlot": {
        "type": "object",
        "properties": {
          "dayOfWeek": {
            "type": "string",
            "minLength": 1,
            "pattern": "MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY"
          },
          "startTime": {
            "type": "string",
            "example": "14:30:00"
          },
          "endTime": {
            "type": "string",
            "example": "14:30:00"
          }
        },
        "required": [
          "endTime",
          "startTime"
        ]
      },
      "VolunteerProfileUpdateRequest": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 50,
            "minLength": 2
          },
          "availableTimeSlots": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/VolunteerAvailableTimeSlot"
            }
          },
          "acceptsGuideDog": {
            "type": "boolean"
          },
          "paceRange": {
            "type": "string",
            "enum": [
              "WALK_RUN",
              "EASY",
