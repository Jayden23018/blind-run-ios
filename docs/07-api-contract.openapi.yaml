# Archived API Contract

This file is intentionally archived.

The active cloud API contract for iOS integration is:

- `docs/api_spec.yaml`
- `docs/test-accounts.md`
- `docs/websocket-protocol.md`

The previous contents of this file described an older local MVP backend with endpoints such as
`/api/auth/phone-login`, `/api/orders/my`, `/api/orders/{orderId}/arrive`, and
`/api/orders/{orderId}/complete`. Those endpoints do not match the current cloud backend contract.

For current development, treat `http://47.114.113.171` and `docs/api_spec.yaml` as the backend source
of truth. The local `backend/` project is a legacy reference only and must not override the cloud
contract.
