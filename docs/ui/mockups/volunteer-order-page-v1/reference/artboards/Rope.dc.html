<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">

<div style="display: flex; flex-direction: column; gap: 10px">

<div style="font-size: 14px; line-height: 1.5; color: #C9D1EC">虚线：还没连上</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<svg width="218" height="36" viewBox="0 0 342 56" aria-hidden="true" style="font-family: 'Noto Sans SC', sans-serif">
<path d="M50 28 Q171 46 292 28" fill="none" stroke="#7C9CF2" stroke-width="3" stroke-linecap="round"></path>
<circle cx="24" cy="28" r="22" fill="#4A76E8"></circle>

</svg>

<div style="font-size: 14px; line-height: 1.5; color: #C9D1EC">实线：绳子接上了</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<circle cx="8" cy="28" r="4" fill="none" stroke="#6A77A3" stroke-width="2"></circle>
<path d="M214 28 Q253 38 292 28" fill="none" stroke="#7C9CF2" stroke-width="3" stroke-linecap="round"></path>
<circle cx="190" cy="28" r="22" fill="#4A76E8"></circle>
<text x="190" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">张</text>
<circle cx="318" cy="28" r="22" fill="#3B4A8A"></circle>
<text x="318" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">李</text>
</svg>
<div style="font-size: 17px; font-weight: 800">出发</div>
<div style="font-size: 14px; line-height: 1.5; color: #C9D1EC">绳子变短 = 离见面更近；左端小圈是出发地，不画走过的路</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<svg width="218" height="36" viewBox="0 0 342 56" aria-hidden="true" style="font-family: 'Noto Sans SC', sans-serif">
<circle cx="8" cy="28" r="4" fill="none" stroke="#6A77A3" stroke-width="2"></circle>
<circle cx="318" cy="28" r="27" fill="none" stroke="#F6C343" stroke-width="2.5"></circle>
<path d="M290 28 L296 28" fill="none" stroke="#7C9CF2" stroke-width="3" stroke-linecap="round"></path>
<circle cx="268" cy="28" r="22" fill="#4A76E8"></circle>
<text x="268" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">张</text>
<circle cx="318" cy="28" r="22" fill="#3B4A8A"></circle>
<text x="318" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">李</text>
</svg>
<div style="font-size: 17px; font-weight: 800">汇合</div>
<div style="font-size: 14px; line-height: 1.5; color: #C9D1EC">跑者一侧亮起暖色光环</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<circle cx="150" cy="28" r="22" fill="#4A76E8"></circle>
<text x="150" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">张</text>
<circle cx="194" cy="28" r="22" fill="#3B4A8A"></circle>
<text x="194" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">李</text>
</svg>
<div style="font-size: 17px; font-weight: 800">跑步中 / 完成</div>
<div style="font-size: 14px; line-height: 1.5; color: #C9D1EC">并肩，绳子收短并变成金色</div>
</div>

</div>
</div>

<div style="margin-top: 16px; background: #F2F3F6; border-radius: 20px; padding: 24px; display: flex; gap: 40px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 10px">
<svg width="218" height="36" viewBox="0 0 342 56" aria-hidden="true" style="font-family: 'Noto Sans SC', sans-serif">
<path d="M50 28 Q171 44 292 28" fill="none" stroke="#C3C9D5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"></path>
<circle cx="24" cy="28" r="22" fill="#2A5BD7"></circle>
<text x="24" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">张</text>
<circle cx="318" cy="28" r="21" fill="#FFFFFF" stroke="#C3C9D5" stroke-width="2" stroke-dasharray="3 3"></circle>
<text x="318" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#8A91A2">李</text>
</svg>
<div style="font-size: 17px; font-weight: 800">浅色 · 仅用于邀请</div>
</div>
<div style="font-size: 15px; line-height: 1.6; color: #5B6272; max-width: 760px">邀请还不属于你，所以用白色头卡；接下之后头卡变成藏青，绳子接上。整个流程只保留一个视觉规则：虚线表示还没约好，实线表示已经约好，两个头像之间的距离就是还要走多远。</div>
</div>
</div>
