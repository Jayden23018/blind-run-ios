<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>订单页 · 邀请</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F3F6}
a{color:#2A5BD7}a:hover{color:#1F47AD}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; display: flex; flex-direction: column; background: #F2F3F6; color: #151A26; font-family: 'Manrope', 'Noto Sans SC', 'PingFang SC', sans-serif; overflow: hidden">

<div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
<div style="width: 84px; display: flex"><button aria-label="返回" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; color: #151A26; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button></div>
<div style="font-size: 16px; font-weight: 700">陪跑邀请</div>
<div style="width: 84px; display: flex; justify-content: flex-end"><button style="height: 44px; padding: 0 14px; border: none; border-radius: 22px; background: #FDECEC; color: #B42318; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"></path></svg>求助</button></div>
</div>

<div style="margin-top: 12px; background: #FFFFFF; border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 14px; font-weight: 700; color: #2A5BD7">新的陪跑邀请</div>
<div style="font-size: 14px; color: #5B6272; font-variant-numeric: tabular-nums">还剩 52 分钟回复</div>
</div>
<div style="margin-top: 10px; height: 3px; border-radius: 2px; background: #E6EDFC; display: flex">
<div style="width: 86%; height: 3px; border-radius: 2px; background: #2A5BD7"></div>
</div>
<svg width="306" height="50" viewBox="0 0 342 56" role="img" aria-label="第 1 步，共 4 步，邀请，还没约好" style="margin-top: 16px; font-family: 'Noto Sans SC', sans-serif">
<path d="M50 28 Q171 44 292 28" fill="none" stroke="#C3C9D5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"></path>
<circle cx="24" cy="28" r="22" fill="#2A5BD7"></circle>
<text x="24" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">张</text>
<circle cx="318" cy="28" r="21" fill="#FFFFFF" stroke="#C3C9D5" stroke-width="2" stroke-dasharray="3 3"></circle>
<text x="318" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#8A91A2">李</text>
</svg>
<div style="margin-top: 14px; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; font-variant-numeric: tabular-nums">周六 7:00</div>
<div style="margin-top: 6px; font-size: 16px; color: #5B6272">深圳湾公园 3 号入口</div>
<div style="margin-top: 16px; background: #F4F6FA; border-radius: 16px; padding: 12px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">3.2<span style="font-size: 13px; font-weight: 600; margin-left: 2px">公里</span></div>
<div style="font-size: 13px; color: #5B6272">离你</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid #E3E6EC; border-right: 1px solid #E3E6EC">
<div style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">5<span style="font-size: 13px; font-weight: 600; margin-left: 2px">公里</span></div>
<div style="font-size: 13px; color: #5B6272">跑多远</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">7'00"</div>
<div style="font-size: 13px; color: #5B6272">配速</div>
</div>
</div>
<div style="margin-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5B6272">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A5BD7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
在你周六早上的空闲时间里
</div>
</div>

<div style="margin-top: 12px; background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #E6EDFC; color: #2A5BD7; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">李</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 700">李先生</div>
<div style="font-size: 14px; color: #5B6272">全盲 · 用引导绳</div>
</div>
</div>
<div style="height: 1px; background: #ECEEF2"></div>
<div style="font-size: 14px; font-weight: 700; color: #5B6272">他写给陪跑员</div>
<div style="font-size: 16px; line-height: 1.6">“我习惯你在我左边。过台阶和转弯前，提前说一声就好。”</div>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #5B6272">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
接下后显示李先生的全名和电话
</div>
<button style="margin-top: 12px; height: 64px; border: 1.5px solid #D9A21E; border-radius: 17px; background: #F6C343; color: #1E1A0B; font-size: 17px; font-weight: 800; box-shadow: 0 6px 16px rgba(217,162,30,0.28); cursor: pointer">接下这次陪跑</button>
<button style="margin-top: 4px; height: 44px; border: none; background: transparent; color: #5B6272; font-size: 15px; font-weight: 600; cursor: pointer">这次去不了</button>
</div>
</x-dc>

return {};

</body>
</html>
