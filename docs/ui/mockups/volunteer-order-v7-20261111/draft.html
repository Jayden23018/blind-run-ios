<h1>陪跑员订单页 v7 定稿：与盲人端订单页同一套设计语言（2026-11-11，#945）</h1>
<p class="lead">负责人 2026-11-11 定「陪跑员端整套换 v7」，看过九屏后原话「可以就具体吧」，只要求 ⑧ 完成、⑨ 已取消两屏不要挤（本稿是改后）。①–④、⑨ 用盲人 v7 的深色头 + 竖线（只展开当前一步）；⑤–⑧ 地图常驻 + 抽屉，照 Uber Driver「去接人」那一屏。竖线五步：接下陪跑 → 商量见面安排 → 等出发 → 去南门汇合 → 开跑。按钮与提示文案全部沿用现行代码。动效只留淡入淡出、当前步圆点呼吸、竖线生长；绳子、弹簧、缩放、滑入全部去掉。示例地点是公共地点。</p>
<div class="g" id="g"></div>
<script>
const TOP=(dark,live,more=true)=>`<div class="tp">${dark?'<div class="bk">‹ 返回</div>':'<div class="rd">‹</div>'}<div class="sp"></div>${more?`<div class="rd ${dark?'dk':''}">···</div>`:''}<div class="sos ${live?'lv':dark?'od':''}">求助</div></div>`;
const HERO=(k,t)=>`<div class="hero"><div class="k">${k}</div><div class="t">${t}</div></div>`;
const MAP=(extra,cls='')=>`<div class="map ${cls}"><div class="park"></div><div class="lake"></div><div class="road" style="left:0;right:0;top:330px;height:14px"></div><div class="road" style="left:262px;top:0;bottom:0;width:14px"></div>${extra}</div>`;
const S=[
{c:'① 邀请详情（派单推送，接单前）',r:'照：盲人 v7 ①',a:'接单前只显示时间、地点、距离、目标与配速等封闭取值；跑者备注等自由文本接单后才显示（AGENTS §8 闸不变）。求助是本地拨号。「这次去不了」沿用现在直发 DECLINE 加 5 秒撤销。',
 h:TOP(1,0,0)+HERO('新的陪跑邀请','明天 7:00 开跑')+`<div class="sh"><div class="pl">朝阳公园南门</div><div class="sb">离你约 2.3 公里 · 5 公里 · 轻松跑</div><div style="margin-top:20px"><div class="n w"><div class="dt"></div><div style="flex:1"><div class="nl">接下陪跑</div><div class="nd">回复剩 4:32</div><div class="cd"><div class="dk"><p>接下后先和跑者通个电话</p><h3>再一起定见面安排</h3></div><div class="lt">接单后才显示跑者备注</div></div></div></div><div class="n t2"><div class="dt"></div><div class="nl"><span class="pre">下一步</span>商量见面安排</div></div><div class="n m"><div class="dt"></div><div class="nl">还有 3 步 ›</div></div></div></div><div class="bt"><div class="cta">接下这次陪跑</div><div class="tx">这次去不了</div></div>`},
{c:'② 通话磨合 · 通话中（PENDING_INTRO_CALL）',r:'照：盲人 v7 ②',a:'标题沿用「等待跑者陈来电 / 跑者陈正在来电」。「不合适」「未接到来电」、举报、不再匹配此人收进右上角「···」（与盲人端「更换陪跑员」一致）。求助仍是本地拨号，改为读 VolunteerOrderSOSMode.resolve。',
 h:TOP(1,0)+HERO('先通个电话','等待跑者陈来电')+`<div class="sh"><div class="pl">朝阳公园南门</div><div class="sb">11 月 10 日 周二 · 上午 7:00 左右</div><div style="margin-top:20px"><div class="n d"><div class="dt">✓</div><div><div class="nl">已接下陪跑</div><div class="nd">今天 23:29</div></div></div><div class="n w"><div class="dt"></div><div style="flex:1"><div class="nl">商量见面安排</div><div class="nd">跑者会打给你 · 剩余 19 分钟</div><div class="cd"><div class="dk"><p>通话后</p><h3>由你填写见面安排</h3></div><div class="lt"><div class="av">陈</div><div>跑者的需要<br><b>轻松跑 · 不带导盲犬</b></div></div></div></div></div><div class="n t2"><div class="dt"></div><div class="nl"><span class="pre">下一步</span>等出发</div></div><div class="n m"><div class="dt"></div><div class="nl">还有 2 步 ›</div></div></div></div><div class="bt"><div class="cta">填写见面安排</div></div>`},
{c:'③ 通话磨合 · 等跑者确认',r:'照：盲人 v7 ③',a:'已提交的安排单五项首屏完整可见；底部只留「修改见面安排」（白底描边），点了仍先弹「修改后需跑者重新确认」。',
 h:TOP(1,0)+HERO('已提交见面安排','等待跑者陈确认')+`<div class="sh"><div><div class="n d f"><div class="dt">✓</div><div class="nl">已完成 1 步 ›</div></div><div class="n w"><div class="dt"></div><div style="flex:1"><div class="nl">商量见面安排</div><div class="nd">跑者确认后即完成约定</div><div class="cd" style="background:#F4F5F8;padding:4px 14px">${[['开跑时间','11 月 10 日 7:00'],['在哪见','朝阳公园南门 · 门卫亭左边'],['跑者上衣','蓝色'],['你的上衣','黄色'],['配速','轻松']].map(([a,b])=>`<div style="padding:8px 0;border-bottom:1px solid #E6E7EB"><div style="font-size:12px;color:#4A4F5C">${a}</div><b style="font-size:16px">${b}</b></div>`).join('')}</div></div></div></div></div><div class="bt"><div class="cta gh">修改见面安排</div></div>`},
{c:'④ 已约好（SCHEDULED_CONFIRMED / PENDING_ACCEPT）',r:'照：盲人 v7 ④',a:'主按钮按现行逻辑在「确认我还会去」「我已经出发了」「我出发了」之间切换，时间未到时置灰并写「x:xx 起可以按」。「我去不了」收进「···」。过了建议出发时间，深色卡标题换成金色「已过建议出发时间 N 分钟」。',
 h:TOP(1,0)+HERO('已约好','明天 7:00 开跑')+`<div class="sh"><div class="pl">朝阳公园南门</div><div class="sb">11 月 10 日 周二 · 7:00</div><div style="margin-top:20px"><div class="n d f"><div class="dt">✓</div><div class="nl">已完成 2 步 ›</div></div><div class="n w"><div class="dt"></div><div style="flex:1"><div class="nl">等出发</div><div class="nd">出发前请确认你还会去</div><div class="cd"><div class="dk"><p>建议 6:35 出发</p><h3>骑车约 15 分钟到南门</h3></div><div class="lt"><div class="av">陈</div><div>你陪的跑者<br><b>陈* · 蓝色上衣</b></div></div></div></div></div><div class="n t2"><div class="dt"></div><div class="nl"><span class="pre">下一步</span>去南门汇合</div></div><div class="n t2"><div class="dt"></div><div class="nl">开跑</div></div></div></div><div class="bt"><div class="cta">确认我还会去</div></div>`},
{c:'⑤ 出发（DRIVER_EN_ROUTE）',r:'照：Uber Driver 第 7 张「Picking up」+ 盲人 v7 ⑤',a:'地图画自己、集合点与跑者实时位置（已有 peerLocation）。快捷回复两枚、导航去集合点（外部地图）都在抽屉里。竖线默认藏，拉起抽屉渐显，同盲人 v7 第 5 条。',
 h:MAP(`<svg style="position:absolute;left:0;top:0" width="390" height="430"><path d="M150 400 L269 400 L269 338" stroke="#1F2433" stroke-width="4" stroke-dasharray="6 6" fill="none"/></svg><div class="mp" style="left:206px;top:300px">南门 · 集合点</div><div class="pv" style="left:290px;top:322px">陈</div><div class="me" style="left:140px;top:392px"></div>`)+TOP(0,0)+`<div class="ms"><div class="grab"></div><div class="st">正在前往南门</div><div class="ss">约 8 分钟 · 1.2 公里</div><div class="who"><div class="av">陈</div><div><div class="nn">陈*</div><div class="dd">蓝色上衣 · 已在南门</div></div><div class="chip">打电话</div></div><div class="chips"><div>我快到了</div><div>再等我 5 分钟</div></div><div class="ln">导航去集合点<span>高德 / 苹果地图 ›</span></div></div><div class="bt"><div class="cta">我已到达集合点</div></div>`},
{c:'⑥ 汇合（DRIVER_ARRIVED）',r:'照：盲人 v7 ⑥；方位盘搬进抽屉',a:'方位盘缩小放在标题右侧；没有方向时不画（沿用 10-05 决定）。等满后主按钮换「结束等待」，小字沿用「结束后不算你的取消，时长不计入」。',
 h:MAP(`<div class="mp" style="left:206px;top:290px">南门 · 你在这</div><div class="me" style="left:262px;top:330px"></div><div class="pv" style="left:228px;top:345px">陈</div>`)+TOP(0,0)+`<div class="ms"><div class="grab"></div><div style="display:flex;gap:12px;align-items:center"><div style="flex:1"><div class="st">陈就在你附近</div><div class="ss">左前方约 20 米</div></div><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="40" fill="#EEEFF2"/><path d="M44 44 L20 12 A40 40 0 0 1 52 5 Z" fill="#1F2433"/><circle cx="44" cy="44" r="6" fill="#2F7BF6"/></svg></div><div class="chips"><div>打电话</div><div>找不到对方</div></div><div class="ln">让陈的手机响起来<span>›</span></div></div><div class="bt"><div class="cap2">见面并握好引导绳后再按</div><div class="cta">开始跑步</div></div>`},
{c:'⑦ 跑步中（IN_PROGRESS）',r:'照：盲人 v7 ⑦',a:'右上角红色实心「求助」开现有求助面板（暂停 / 让对方手机响 / 联系客服 / 长按 3 秒紧急求助），面板与二次确认文案不改。走散、电量低、定位弱提示条在抽屉里，同一时刻最多一条。暂停时主区换「继续陪跑」。',
