spring:
  application:
    name: aidrun-backend
  datasource:
    url: jdbc:h2:mem:aidrun_demo;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /openapi/aidrun-mvp.yaml

aidrun:
  jwt:
    issuer: aidrun-demo
    demo-secret: local-demo-secret-change-before-production
